name: Build Sinmai-Assist

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild Sinmai-Assist.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Sinmai-Assist-build
          path: |
            **/bin/Release/**
            Output/**
